[project]
name = "financial-market-regime-detection-system"
version = "1.0.0"
description = "End-to-end quantitative system for financial market regime detection, probabilistic forecasting, and automated risk allocation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Gael Rendon" }
]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "seaborn>=0.12.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.25.0",
    "notebook>=7.0.0",
]

[tool.uv]
package = false
